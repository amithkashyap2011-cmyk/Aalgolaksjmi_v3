<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070d1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AALGO" />
    <meta name="description" content="AI-powered crypto trading platform" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AALGOLAKSHMI V3</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem("aalgo_theme");
          if (!t || t === "light") {
            t = "dark";
            localStorage.setItem("aalgo_theme", "dark");
          }
          var isDark = t !== "solar" && t !== "light";
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased overscroll-none" style="background:#070d1a;color:#f1f5f9;margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
