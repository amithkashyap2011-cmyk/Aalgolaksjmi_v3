name: Verification (tests, coverage, canary, concurrency)

# NOT run/proven in an actual GitHub Actions environment this pass — authored
# and its component steps verified locally (the exact commands below were
# actually executed against this repo), but the workflow file itself has not
# been exercised by real CI. Treat as authored-and-locally-verified, not
# CI-proven, until it runs once for real.

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Initialize MongoDB replica set
        # withWalletLock / debitWalletAndCreateTrade / creditWalletAndCloseTrade
        # (exercised by the concurrency regression tests) require a replica
        # set for multi-document transactions — a plain standalone mongod
        # will fail these tests with a real, meaningful error, not silently.
        run: |
          sudo apt-get update && sudo apt-get install -y mongodb-mongosh || true
          mongosh --host localhost:27017 --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          sleep 3
          mongosh --host localhost:27017 --eval 'rs.status()'

      - name: TypeScript compilation
        working-directory: server
        run: npx tsc --noEmit

      - name: Canary — verify ESM mock interception actually works
        # Runs first and alone, deliberately, so a misconfigured Node/Jest
        # environment fails loudly and immediately rather than letting every
        # other test below silently pass or fail for the wrong reason.
        working-directory: server
        env:
          MONGO_URI_TEST: "mongodb://localhost:27017/aalgolakshmi_test?replicaSet=rs0"
        run: node --experimental-vm-modules node_modules/.bin/jest __tests__/_canary.test.ts --forceExit --detectOpenHandles

      - name: Full test suite (unit + property + concurrency + determinism)
        working-directory: server
        env:
          MONGO_URI_TEST: "mongodb://localhost:27017/aalgolakshmi_test?replicaSet=rs0"
        run: node --experimental-vm-modules node_modules/.bin/jest --coverage --coverageReporters=json-summary --coverageReporters=text-summary --forceExit --detectOpenHandles --verbose

      - name: Coverage regression gate
        working-directory: server
        run: node ci/check-coverage-regression.mjs

      - name: Update verification dashboard
        working-directory: server
        run: node ci/generate-dashboard.mjs

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: verification-dashboard
          path: |
            server/ci/dashboard.json
            server/ci/dashboard-history.jsonl

      - name: Dependency vulnerability audit
        working-directory: server
        run: npm audit --audit-level=high

      - name: Production build
        working-directory: server
        run: npm run build

  # Stryker DOES work on this project (verified: a real, timed, executed
  # run — not a config-only guess) as long as NODE_OPTIONS carries the same
  # --experimental-vm-modules flag the rest of this suite needs for ESM
  # mocking; omitting it would silently let every jest.unstable_mockModule
  # call fall through to the real implementation during mutation testing,
  # same failure mode the canary test guards against elsewhere.
  #
  # Scope is intentionally narrow for now — stryker.conf.json's `mutate`
  # list covers only pnlService.ts and autoTradeEngine.decisionLogic.ts,
  # the two smallest fully-pure, already-well-tested files. Measured score:
  # 83.66% (pnlService.ts 97.26%, decisionLogic.ts 78.26%). Expanding
  # `mutate` to riskEngine.ts, paperState.ts, and the rest of the AQEA
  # engine is the top mutation-testing roadmap item — not attempted this
  # pass because Stryker's runtime scales with mutant count × test suite
  # size, and untimed expansion risked an unbounded CI runtime.
  mutation-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Run Stryker (scoped)
        working-directory: server
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
        run: npx stryker run
      - name: Mutation score regression gate
        working-directory: server
        run: node ci/check-mutation-regression.mjs
      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: server/reports/mutation/mutation.json
