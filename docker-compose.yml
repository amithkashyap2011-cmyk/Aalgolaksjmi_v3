version: '3.8'

services:
  aks-engine:
    build: .
    container_name: quant-hft-engine
    ports:
      - "3000:3000"
    environment:
      # The server persists its ledger and telemetry through Mongoose.  Keep
      # this topology aligned with the runtime rather than provisioning an
      # unused PostgreSQL database.
      - MONGO_URI=mongodb://mongo:27017/aalgolakshmi
      - REDIS_URL=redis://redis:6379
      # This stack exposes HTTP directly for local use. Production must set
      # NODE_ENV=production and provide TLS or a trusted TLS proxy explicitly.
      - NODE_ENV=${NODE_ENV:-development}
      - TRUST_PROXY=${TRUST_PROXY:-false}
    depends_on:
      - mongo
      - redis
      - kafka
    networks:
      - hft_net
    restart: always

  mongo:
    image: mongo:7
    container_name: quant-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - hft_net

  redis:
    image: redis:7-alpine
    container_name: quant-cache
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - hft_net

  kafka:
    image: bitnami/kafka:latest
    container_name: quant-kafka
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    ports:
      - "9092:9092"
    networks:
      - hft_net

  prometheus:
    image: prom/prometheus:latest
    container_name: observability-prom
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - hft_net

  grafana:
    image: grafana/grafana-oss:latest
    container_name: observability-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - hft_net

networks:
  hft_net:
    driver: bridge

volumes:
  mongodata:
  redisdata:
